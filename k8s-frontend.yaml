apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: your-docker-repo/cloud1pm-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud1pm-ingress
  annotations:
    # AWS나 로컬 환경에 따라 필요한 Ingress Controller 클래스 지정 (필요 시 주석 해제)
    # kubernetes.io/ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          # 1. /api/* 요청 -> 백엔드 서비스(80포트)로 전달
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          # 2. 그 외 모든 요청 -> 프론트엔드 서비스(80포트)로 전달
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
