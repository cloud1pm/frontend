apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud1pm-ingress
  annotations:
    # Nginx Ingress Controller를 사용하는 경우 (필요 시 활성화)
    # kubernetes.io/ingress.class: nginx
    # api 경로의 rewrite가 필요하다면 아래 주석 해제 (현재 구조에선 불필요해 보임)
    # nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
    - http:
        paths:
          # 1. /api 로 시작하는 요청은 백엔드로 보냄
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          # 2. 그 외 나머지 요청은 프론트엔드로 보냄
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
